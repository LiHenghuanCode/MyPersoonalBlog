<!DOCTYPE html>
<!--
  ============================================
  课程笔记模板
  用法：
    1. 复制本文件，改名成 courses/<英文短名>.html
    2. 改掉 <title> / <h1> / .detail-meta 和正文
    3. 到 assets/courses.js 的 COURSES 数组开头加一项，
       note 填 "courses/<英文短名>.html"
  下面的小标题只是建议，不合适就删
  ============================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程笔记模板 — 李恒桓</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="page page-detail">
  <main>
    <a class="back" href="index.html">← 返回课程列表</a>

    <h1 class="detail-title">课程名写这里</h1>
    <div class="detail-meta">
      学校 · 课程编号 <span class="when">｜ 开始于 2026.10</span>
    </div>
    <div class="stack"><a href="#">课程主页 ↗</a></div>

    <footer>
